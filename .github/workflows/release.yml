name: Build Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# This workflow uploads Actions artifacts only. Publication and replacement of
# GitHub Release assets remain separate, deliberate maintainer operations.
permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    runs-on: macos-15
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      CARGO_TARGET_DIR: /tmp/cli-manager-release-target
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Validate release metadata
        id: metadata
        env:
          BUILD_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const tauri = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8"));
          const cargo = readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"$/m)?.[1];
          const version = pkg.version;
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error("The desktop release version must be a semantic version");
          }
          if (tauri.version !== version || cargo !== version) {
            throw new Error("package.json, Tauri and Cargo desktop versions must match");
          }
          if (process.env.BUILD_REF.startsWith("refs/tags/") && process.env.BUILD_REF !== "refs/tags/v" + version) {
            throw new Error("The release tag must match v<desktop version>");
          }
          if (!existsSync("docs/releases/v" + version + ".md")) {
            throw new Error("Add the versioned release notes before building release artifacts");
          }
          appendFileSync(process.env.GITHUB_OUTPUT, "version=" + version + "\narchive=CLI-Manager-" + version + "-macos-arm64.zip\n");
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Check frontend and backend
        run: |
          npx tsc --noEmit
          node --test scripts/*.test.mjs
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      # With no bundled SSH Agent files, the existing runtime uses its signed
      # remote manifest fallback. Desktop releases do not rebuild that Agent,
      # change its trust root, or require upstream R2/signing credentials.
      - name: Build macOS Apple Silicon app
        run: |
          export CARGO_ENCODED_RUSTFLAGS="$(printf '%s\037%s' "--remap-path-prefix=$HOME=/build" "--remap-path-prefix=$GITHUB_WORKSPACE=/workspace")"
          export CFLAGS="-ffile-prefix-map=$HOME=/build -ffile-prefix-map=$GITHUB_WORKSPACE=/workspace"
          export CXXFLAGS="$CFLAGS"
          npm run tauri:build:local -- --bundles app --target aarch64-apple-darwin

      - name: Verify and archive app
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          ARCHIVE_NAME: ${{ steps.metadata.outputs.archive }}
          BUILD_REF: ${{ github.ref }}
        run: |
          app_bundle="$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle/macos/CLI-Manager.app"
          test -d "$app_bundle"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_bundle/Contents/Info.plist")" = "$RELEASE_VERSION"
          for executable in cli-manager cli-manager-daemon
          do
            test -x "$app_bundle/Contents/MacOS/$executable"
            test "$(lipo -archs "$app_bundle/Contents/MacOS/$executable")" = "arm64"
            codesign --verify --strict "$app_bundle/Contents/MacOS/$executable"
          done
          codesign --verify --deep --strict "$app_bundle"
          export CLI_MANAGER_APP_BUNDLE="$app_bundle"
          python3 <<'PY'
          import os
          from pathlib import Path
          prefixes = [os.environ["HOME"].encode(), os.environ["GITHUB_WORKSPACE"].encode()]
          for name in ["cli-manager", "cli-manager-daemon"]:
              binary = Path(os.environ["CLI_MANAGER_APP_BUNDLE"]) / "Contents" / "MacOS" / name
              if any(prefix in binary.read_bytes() for prefix in prefixes):
                  raise SystemExit("A build-machine path remains in " + name)
          PY
          test -z "$(find "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle" -name '*.dmg' -print -quit)"
          mkdir -p dist/release
          package_root="$RUNNER_TEMP/cli-manager-release-package"
          mkdir -p "$package_root/licenses/conpty" "$package_root/licenses/third-party" "$package_root/licenses/fonts"
          ditto "$app_bundle" "$package_root/CLI-Manager.app"
          cp LICENSE NOTICE "$package_root/"
          cp src-tauri/resources/conpty/LICENSE src-tauri/resources/conpty/README.md "$package_root/licenses/conpty/"
          cp third-party/vscode-LICENSE third-party/ccstatusline-zh-LICENSE "$package_root/licenses/third-party/"
          cp src-tauri/resources/fonts/LICENSE-NERD-FONTS-SYMBOLS.txt "$package_root/licenses/fonts/"
          export CLI_MANAGER_PACKAGE_ROOT="$package_root"
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { join } from "node:path";
          const repository = "https://github.com/" + process.env.GITHUB_REPOSITORY;
          const tag = process.env.BUILD_REF.startsWith("refs/tags/") ? process.env.BUILD_REF.slice(10) : null;
          const ref = encodeURIComponent(tag || process.env.GITHUB_SHA);
          const archiveRef = tag ? "refs/tags/" + ref : ref;
          writeFileSync(join(process.env.CLI_MANAGER_PACKAGE_ROOT, "SOURCE.txt"), [
            "CLI-Manager " + process.env.RELEASE_VERSION + " (AGPL-3.0-or-later)",
            "Corresponding source for this binary distribution:",
            repository + "/tree/" + ref,
            repository + "/archive/" + archiveRef + ".zip",
            repository + "/archive/" + archiveRef + ".tar.gz",
            "Build commit: " + process.env.GITHUB_SHA,
            "Build instructions: README.md and README.zh-CN.md in the source tree.",
            "Third-party notices: NOTICE and licenses/.",
            "",
          ].join("\n"));
          NODE
          ditto -c -k --sequesterRsrc "$package_root" "dist/release/$ARCHIVE_NAME"
          mkdir -p "$RUNNER_TEMP/cli-manager-release-check"
          ditto -x -k "dist/release/$ARCHIVE_NAME" "$RUNNER_TEMP/cli-manager-release-check"
          codesign --verify --deep --strict "$RUNNER_TEMP/cli-manager-release-check/CLI-Manager.app"
          for required in LICENSE NOTICE SOURCE.txt licenses/conpty/LICENSE licenses/conpty/README.md licenses/third-party/vscode-LICENSE licenses/third-party/ccstatusline-zh-LICENSE licenses/fonts/LICENSE-NERD-FONTS-SYMBOLS.txt
          do
            test -s "$RUNNER_TEMP/cli-manager-release-check/$required"
          done

      - name: Generate checksums
        working-directory: dist/release
        env:
          ARCHIVE_NAME: ${{ steps.metadata.outputs.archive }}
        run: |
          shasum -a 256 "$ARCHIVE_NAME" > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CLI-Manager-${{ steps.metadata.outputs.version }}-macos-arm64
          path: |
            dist/release/${{ steps.metadata.outputs.archive }}
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Record release handoff
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          ARCHIVE_NAME: ${{ steps.metadata.outputs.archive }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            "Built **" + process.env.ARCHIVE_NAME + "** and **SHA256SUMS.txt** from commit " + process.env.GITHUB_SHA + ".",
            "",
            "This workflow only uploads Actions artifacts; it does not publish or overwrite a GitHub Release.",
            "Review docs/releases/v" + process.env.RELEASE_VERSION + ".md and the checksums before publishing.",
            "",
            "Only a macOS Apple Silicon .app archive is built. No DMG, Windows or Linux desktop package is generated.",
            "",
          ].join("\n"));
          NODE
